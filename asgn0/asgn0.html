<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Draw a blue rectangle (canvas version)</title>
  </head>

  <body onload="main()">
    <div>
      <canvas id="example" width="400" height="400">
        Please use a browser that supports "canvas"
      </canvas>

      <div>
        <strong style="padding-left: 40px; padding-right: 20px;">v1:</strong>
        x: <input id="v1x" style="width: 70px">
        y: <input id="v1y" style="width: 70px">
      </div>
      <div>
        <strong style="padding-left: 40px; padding-right: 20px;">v2:</strong>
        x: <input id="v2x" style="width: 70px">
        y: <input id="v2y" style="width: 70px">
      </div>

      <input type="button" id="draw-vectors" value="draw vectors" style="width: 90px; margin-left: 140px;">

      <div>
        <br>
        <label for="op" style="margin: 18px;">Operation: </label>
        <select name="op" id="op">
          <option value="add">add</option>
          <option value="sub">sub</option>
          <option value="mul">mul</option>
          <option value="div"">div</option>
        </select>
        <input type="button" id="draw-operation" value="draw operation" style="margin-left: 8px;">
      </div>
    </div>

    <div id="scalar-menu" style="display:none">
      <label for="scalar-input" style="margin-left:48px; margin-right: 8px;">scalar:</label>
      <input type="text" id="scalar-input" style="width: 70px;">
    </div>

    <script src="asgn0.js"></script>
    <script src="lib/cuon-matrix-cse160.js"></script>
  </body>
</html>
